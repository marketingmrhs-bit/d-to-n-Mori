  don:  { short: 'Móng đơn', k: 0.3 }
};
const HAM = {
  none: null,
  d1: { label: 'Sâu dưới 1,2 m', k: 1.5, depth: 1.0 },
  d2: { label: 'Sâu 1,2 – 1,8 m', k: 1.7, depth: 1.5 },
  d3: { label: 'Sâu trên 1,8 m', k: 2.0, depth: 2.4 }
};
const MAI = {
  btct: { label: 'Bê tông cốt thép đúc bằng', k: 0.5, slope: false },
  ton:  { label: 'Mái tôn', k: 0.35, slope: true, rise: 0.12 },
  ngoi: { label: 'Mái ngói, xà gồ sắt', k: 0.5, slope: true, rise: 0.28 },
  xien: { label: 'Bê tông xiên dán ngói', k: 0.75, slope: true, rise: 0.28 }
};
// floors[0] = tầng trệt, floors[i] = lầu i. null nghĩa là lấy theo tầng trệt (trệt lấy theo ngang × dài).
const DEFAULTS = { type: 'pho', w: 5, l: 15, floors: [null], mez: false, mezA: null, tum: false, tumA: 20, st: false, roof: 'btct', mong: 'bang', nen: true, ham: 'none', hamA: null, sanT: 0, sanS: 0 };
const STORE_KEY = 'mori-du-toan-v2';

/* ===== Định dạng số kiểu Việt Nam ===== */
const r2 = n => Math.round(n * 100) / 100;
const group = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
function fmt(n) { const v = r2(n); let [i, f] = Math.abs(v).toFixed(2).split('.'); f = f.replace(/0+$/, ''); return (v < 0 ? '-' : '') + group(i) + (f ? ',' + f : ''); }
const vnd = n => group(String(Math.round(n))) + ' đ';
const pct = k => fmt(k * 100) + '%';
function tyNum(n) { return (n / 1e9).toFixed(2).replace('.', ',').replace(/,?0+$/, ''); }
function short(n) { return n >= 1e9 ? tyNum(n) + ' tỷ' : group(String(Math.round(n / 1e6))) + ' triệu'; }
function shortRange(a, b) { return (a >= 1e9 && b >= 1e9) ? tyNum(a) + ' – ' + tyNum(b) + ' tỷ' : short(a) + ' – ' + short(b); }
function parseNum(s) { const t = String(s).trim().replace(/\s/g, '').replace(',', '.'); if (!/^\d*\.?\d+$|^\d+\.$/.test(t)) return NaN; return parseFloat(t); }
const defMez = a0 => Math.max(1, Math.round(a0 * 0.6));
const floorsText = n => n === 1 ? 'Chỉ tầng trệt' : 'Trệt + ' + (n - 1) + ' lầu';
const clone = o => JSON.parse(JSON.stringify(o));

/* ===== Tính diện tích quy đổi ===== */
function compute(s) {
  const Axd = r2(s.w * s.l);
  const A0 = s.floors[0] == null ? Axd : s.floors[0];
  const issues = {};
  if (A0 < 10) issues.dim = 'Tầng trệt tối thiểu 10 m².';
  const floors = s.floors.map((v, i) => i === 0 ? A0 : (v == null ? A0 : v));
  const n = floors.length;
  const top = floors[n - 1];
  const rows = [];

  const m = MONG[s.mong];
  const withNen = s.mong === 'bang' && s.nen;
  rows.push({ id: 'mong', name: 'Móng', note: m.short + (withNen ? ', có đổ nền bê tông' : ''), area: A0, k: withNen ? m.kNen : m.k });

  let hamA = 0;
  const ham = HAM[s.ham];
  if (ham) {
    hamA = s.hamA == null ? A0 : s.hamA;
    if (hamA > A0) { issues.ham = 'Hầm không được lớn hơn diện tích móng (' + fmt(A0) + ' m²). Đang tính theo ' + fmt(A0) + ' m².'; hamA = A0; }
    rows.push({ id: 'ham', name: 'Tầng hầm', note: ham.label, area: hamA, k: ham.k });
  }

  rows.push({ id: 'tret', name: 'Tầng trệt', area: A0, k: 1 });

  let mezA = 0, voidA = 0;
  if (s.mez) {
    mezA = s.mezA == null ? defMez(A0) : s.mezA;
    if (mezA >= A0) { issues.mez = 'Tầng lửng phải nhỏ hơn tầng trệt (' + fmt(A0) + ' m²).'; mezA = Math.max(1, A0 - 1); }
    voidA = r2(A0 - mezA);
    rows.push({ id: 'lung', name: 'Tầng lửng', area: mezA, k: 1 });
    rows.push({ id: 'thong', name: 'Ô thông tầng của lửng', note: voidA < 8 ? 'Dưới 8 m², tính như sàn' : 'Từ 8 m², tính 50%', area: voidA, k: voidA < 8 ? 1 : 0.5 });
  }

  for (let i = 1; i < n; i++) rows.push({ id: 'lau' + i, name: 'Lầu ' + i, note: 'Tầng ' + (i + 1), area: floors[i], k: 1 });

  let tumA = 0;
  if (s.tum) {
    tumA = s.tumA;
    if (tumA > top) { issues.tum = 'Tum không lớn hơn tầng trên cùng (' + fmt(top) + ' m²). Đang tính theo ' + fmt(top) + ' m².'; tumA = top; }
    rows.push({ id: 'tum', name: 'Tum thang', area: tumA, k: 1 });
  }
  const stA = s.st ? r2(top - tumA) : 0;
  if (stA > 0) rows.push({ id: 'st', name: 'Sân thượng', area: stA, k: 0.5 });

  const roofA = s.st ? tumA : top;
  const mai = MAI[s.roof];
  if (roofA > 0) rows.push({ id: 'mai', name: 'Mái', note: mai.label + (s.st ? ', che tum' : ''), area: roofA, k: mai.slope ? mai.k * CONFIG.heSoNghieng : mai.k, kText: mai.slope ? pct(mai.k) + ' × 1,4' : null });

  if (s.sanT > 0) rows.push({ id: 'sant', name: 'Sân trước', area: s.sanT, k: 0.5 });
  if (s.sanS > 0) rows.push({ id: 'sans', name: 'Sân sau', area: s.sanS, k: 0.5 });

  rows.forEach(r => { r.q = r2(r.area * r.k); });
  const total = r2(rows.reduce((a, r) => a + r.q, 0));
  const price = MO_HINH[s.type].price;
  const cost = Math.round(total * price);
  return { Axd, A0, floors, n, top, rows, total, price, cost, mezA, voidA, hamA, tumA, stA, roofA, issues,
    low: cost * (1 + CONFIG.vatTu[0]), high: cost * (1 + CONFIG.vatTu[1]) };
}

/* ===== Mặt cắt minh họa ===== */
function drawHouse(s, r) {
  const W = Math.max(s.w, 0.5);
  const L = r.A0 / W;
  const depths = r.floors.map(a => Math.max(a / W, 0.5));
  const sanTD = s.sanT / W, sanSD = s.sanS / W;
  const xf = sanTD, xb = sanTD + L;
  const xmin = Math.min(0, xb - Math.max(...depths)), xmax = xb + sanSD;
  const ham = HAM[s.ham];
  const base = ham ? Math.max(0.3, 3.0 - ham.depth) : 0.3;
  const tretH = s.mez ? 5.2 : 3.6, lauH = 3.4, tumH = 3.0;
  const levels = [];
  let y = base;
  levels.push({ y0: y, h: tretH, d: depths[0], name: 'Tầng trệt', a: r.A0 }); y += tretH;
  for (let i = 1; i < r.n; i++) { levels.push({ y0: y, h: lauH, d: depths[i], name: 'Lầu ' + i, a: r.floors[i] }); y += lauH; }
  const yTop = y, topD = depths[r.n - 1];
  const tumD = s.tum ? Math.min(r.tumA / W, topD) : 0;
  const mai = MAI[s.roof];
  let roof = null;
  if (r.roofA > 0) {
    const span = s.st ? tumD : topD;
    const y0 = s.tum ? yTop + tumH : yTop;
    const rise = mai.slope ? Math.min(span * mai.rise, 3.6) : 0.35;
    roof = { x0: xb - span, x1: xb, y0, rise };
  }
  const yMax = Math.max(roof ? roof.y0 + roof.rise : 0, s.tum ? yTop + tumH : 0, yTop + 1.0) + 0.5;
  const fTop = ham ? -ham.depth : 0;
  const yMin = fTop - 1.6;

  const VW = 380, LX = 258, DW = 196, TOP = 12;
  const sc = Math.min(DW / (xmax - xmin), 340 / (yMax - yMin));
  const gx = 40 + DW - (xmax - xmin) * sc;
  const X = x => gx + (x - xmin) * sc;
  const Y = v => TOP + (yMax - v) * sc;
  const VH = Math.ceil(Y(yMin) + 8);
  const f1 = n => n.toFixed(1);
  const rect = (x0, y0, x1, y1, cls) => `<rect x="${f1(X(x0))}" y="${f1(Y(y1))}" width="${f1(Math.max(0, (x1 - x0) * sc))}" height="${f1(Math.max(0, (y1 - y0) * sc))}" class="${cls}"/>`;
  let g = '';
  g += `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="g-hatch"/></pattern></defs>`;
  const gR = X(xmax) + 10;
  g += `<rect x="6" y="${f1(Y(0))}" width="${f1(gR - 6)}" height="${f1(Y(yMin) - Y(0))}" class="g-earth"/>`;
  if (sanTD > 0) g += rect(0, 0, xf, 0.12, 'g-pav');
  if (sanSD > 0) g += rect(xb, 0, xmax, 0.12, 'g-pav');
  if (ham) g += rect(xb - Math.min(r.hamA / W, L), -ham.depth, xb, base, 'g-sunk');

  // móng
  const nCol = Math.max(2, Math.round(L / 4) + 1);
  for (let i = 0; i < nCol; i++) {
    const cx = xf + 0.3 + (L - 0.6) * i / (nCol - 1);
    g += rect(cx - 0.16, fTop - 1.1, cx + 0.16, fTop, 'g-found');
    if (s.mong === 'don') g += rect(cx - 0.7, fTop - 1.45, cx + 0.7, fTop - 1.05, 'g-found');
  }
  if (s.mong === 'bang') g += rect(xf, fTop - 1.45, xb, fTop - 1.05, 'g-found');
  if (s.mong === 'bang' && s.nen && !ham) g += rect(xf, -0.05, xb, 0.3, 'g-nen');

  // các tầng
  levels.forEach(l => { g += rect(xb - l.d, l.y0, xb, l.y0 + l.h, 'g-level'); });
  if (s.mez) {
    const md = Math.min(r.mezA / W, L);
    g += rect(xb - md, base + 2.8, xb, base + 3.0, 'g-slab');
    if (L - md > 0.2) g += `<rect x="${f1(X(xf) + 3)}" y="${f1(Y(base + tretH) + 3)}" width="${f1(Math.max(0, (L - md) * sc - 6))}" height="${f1(Math.max(0, (tretH - 2.8) * sc - 6))}" class="g-void"/>`;
  }
  levels.forEach(l => { g += rect(xb - l.d, l.y0 + l.h - 0.18, xb, l.y0 + l.h, 'g-slab'); });
  if (s.tum && tumD > 0) g += rect(xb - tumD, yTop, xb, yTop + tumH, 'g-level');
  if (s.st && topD - tumD > 0.05) g += rect(xb - topD, yTop, xb - tumD, yTop + 1.0, 'g-para');

  // mái
  if (roof) {
    const px0 = X(roof.x0), px1 = X(roof.x1), py = Y(roof.y0), pt = Y(roof.y0 + roof.rise), pm = (px0 + px1) / 2;
    if (s.roof === 'btct') g += rect(roof.x0 - 0.2, roof.y0, roof.x1, roof.y0 + roof.rise, 'g-roof');
    else {
      const pts = `${f1(px0 - 3)},${f1(py)} ${f1(pm)},${f1(pt)} ${f1(px1 + 3)},${f1(py)}`;
      if (s.roof === 'xien') g += `<polygon points="${pts}" class="g-roof"/>`;
      else {
        g += `<polygon points="${pts}" class="g-roof-soft"/>`;
        if (s.roof === 'ngoi') g += `<path d="M${f1(pm)} ${f1(pt)}V${f1(py)}M${f1((px0 + pm) / 2)} ${f1((py + pt) / 2)}L${f1(pm)} ${f1(py)}M${f1((px1 + pm) / 2)} ${f1((py + pt) / 2)}L${f1(pm)} ${f1(py)}" class="g-truss"/>`;
      }
    }
  }
  g += `<line x1="6" y1="${f1(Y(0))}" x2="${f1(gR)}" y2="${f1(Y(0))}" class="g-ground"/>`;
  g += `<text x="8" y="${f1(Y(0) - 5)}" class="g-note">Vỉa hè</text>`;
  if (sanTD * sc > 46) g += `<text x="${f1(X(xf / 2))}" y="${f1(Y(0) - 5)}" text-anchor="middle" class="g-note">Sân trước</text>`;
  if (sanSD * sc > 40) g += `<text x="${f1(X(xb + sanSD / 2))}" y="${f1(Y(0) - 5)}" text-anchor="middle" class="g-note">Sân sau</text>`;

  // nhãn
  const labels = [];
  if (roof) labels.push({ y: Y(roof.y0 + roof.rise * 0.4), name: 'Mái', a: r.roofA });
  if (s.tum && tumD > 0) labels.push({ y: Y(yTop + tumH / 2), name: 'Tum', a: r.tumA });
  if (r.stA > 0) labels.push({ y: Y(yTop + 0.5), name: 'Sân thượng', a: r.stA });
  for (let i = levels.length - 1; i >= 1; i--) labels.push({ y: Y(levels[i].y0 + levels[i].h / 2), name: levels[i].name, a: levels[i].a });
  if (s.mez) labels.push({ y: Y(base + 2.9), name: 'Lửng', a: r.mezA });
  labels.push({ y: Y(base + (s.mez ? 1.4 : tretH / 2)), name: 'Tầng trệt', a: r.A0 });
  if (ham) labels.push({ y: Y((fTop + base) / 2), name: 'Hầm', a: r.hamA });
  labels.push({ y: Y(fTop - 1.0), name: 'Móng', a: r.A0 });
  const GAP = 15;
  const ly = labels.map(l => l.y);
  for (let i = 1; i < ly.length; i++) if (ly[i] < ly[i - 1] + GAP) ly[i] = ly[i - 1] + GAP;
  const over = ly[ly.length - 1] - (VH - 8);
  if (over > 0) for (let i = 0; i < ly.length; i++) ly[i] -= over;
  for (let i = ly.length - 2; i >= 0; i--) if (ly[i] > ly[i + 1] - GAP) ly[i] = ly[i + 1] - GAP;
  const ex = X(xb) + 3;
  labels.forEach((l, i) => {
    g += `<path d="M${f1(ex)} ${f1(l.y)}H${f1(ex + 6)}L${f1(LX - 6)} ${f1(ly[i])}H${f1(LX - 3)}" class="g-lead"/>`;
    g += `<text x="${LX}" y="${f1(ly[i] + 4)}" class="g-name">${l.name}</text>`;
    g += `<text x="${VW - 4}" y="${f1(ly[i] + 4)}" text-anchor="end" class="g-val">${fmt(l.a)} m²</text>`;
  });
  return `<svg viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Mặt cắt minh họa công trình theo số liệu đã nhập">${g}</svg>`;
}

/* ===== Trạng thái và giao diện ===== */
const $ = s => root.querySelector(s);
let S = load();

function load() {
  const d = clone(DEFAULTS);
  try {
    const o = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!o || typeof o !== 'object') return d;
    for (const k in d) {
      if (!(k in o)) continue;
      if (k === 'floors') {
        const f = o.floors;
        if (Array.isArray(f) && f.length >= 1 && f.length <= CONFIG.maxTang && f.every(v => v === null || (typeof v === 'number' && v > 0))) d.floors = f;
        continue;
      }
      if (d[k] === null ? (o[k] === null || typeof o[k] === 'number') : typeof o[k] === typeof d[k]) d[k] = o[k];
    }
    if (!MO_HINH[d.type]) d.type = 'pho';
    if (!MAI[d.roof]) d.roof = 'btct';
    if (!MONG[d.mong]) d.mong = 'bang';
    if (!(d.ham in HAM)) d.ham = 'none';
  } catch (e) {}
  return d;
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

const tret = () => S.floors[0] == null ? r2(S.w * S.l) : S.floors[0];
function getVal(key) {
  if (key.startsWith('f:')) { const i = +key.slice(2); if (i === 0) return tret(); return S.floors[i] == null ? tret() : S.floors[i]; }
  if (key === 'mezA') return S.mezA == null ? defMez(tret()) : S.mezA;
  if (key === 'hamA') return S.hamA == null ? tret() : S.hamA;
  return S[key];
}
function setVal(key, v) {
  if (key.startsWith('f:')) { S.floors[+key.slice(2)] = v; return; }
  S[key] = v;
}

function renderFloors() {
  $('#floorlist').innerHTML = S.floors.map((_, i) => {
    const name = i === 0 ? 'Tầng trệt' : 'Lầu ' + i;
    return `<div class="floorrow"><label class="lbl" for="in-f${i}">${name}<small>Tầng ${i + 1}</small></label>` +
      `<div class="numin" data-key="f:${i}" data-min="1" data-max="5000"><input id="in-f${i}" inputmode="decimal" autocomplete="off"><span class="unit">m²</span></div>` +
      (i ? `<button type="button" class="rm" data-rm="${i}" aria-label="Bỏ ${name}">×</button>` : '<span></span>') + `</div>`;
  }).join('');
  const add = $('#add-floor');
  const full = S.floors.length >= CONFIG.maxTang;
  add.disabled = full;
  add.textContent = full ? 'Tối đa ' + CONFIG.maxTang + ' tầng' : '+ Thêm tầng';
}

function syncControls() {
  root.querySelectorAll('input[type=checkbox][data-key]').forEach(c => { c.checked = !!S[c.dataset.key]; });
  ['type', 'roof', 'mong', 'ham'].forEach(n => { root.querySelectorAll(`input[name=${n}]`).forEach(r => { r.checked = r.value === S[n]; }); });
}

function syncInputs() {
  root.querySelectorAll('.numin').forEach(box => {
    const inp = box.querySelector('input');
    if (root.activeElement === inp) return;
    inp.value = fmt(getVal(box.dataset.key));
  });
}

function setErr(id, msg, sel) {
  const el = $('#e-' + id);
  if (el) { el.hidden = !msg; el.textContent = msg || ''; }
  if (sel) root.querySelectorAll(sel).forEach(s => s.classList.toggle('bad', !!msg));
}

function update() {
  const r = compute(S);
  syncInputs();

  $('#d-land-l').textContent = fmt(S.w) + ' × ' + fmt(S.l) + ' m';
  $('#d-land').textContent = fmt(r.Axd) + ' m²';
  $('#d-n').textContent = floorsText(r.n) + ' · tổng diện tích sàn';
  $('#d-sum').textContent = fmt(r.floors.reduce((a, b) => a + b, 0)) + ' m²';

  $('#g-mez').hidden = !S.mez;
  if (S.mez) { $('#d-void-l').textContent = 'Ô thông tầng · ' + (r.voidA < 8 ? 'dưới 8 m², tính 100%' : 'tính 50%'); $('#d-void').textContent = fmt(r.voidA) + ' m²'; }

  $('#g-tum').hidden = !S.tum;
  $('#d-st').textContent = S.st ? 'Phần mái bằng còn lại ngoài tum, ' + fmt(r.stA) + ' m², tính 50%' : 'Không có sân thượng, mái che toàn bộ tầng trên cùng';

  const noRoof = r.roofA <= 0;
  root.querySelectorAll('input[name=roof]').forEach(x => { x.disabled = noRoof; });
  $('#d-roof').textContent = noRoof ? '· không có mái riêng, sàn sân thượng là mái' : '· che ' + fmt(r.roofA) + ' m²' + (S.st ? ' trên tum' : ' tầng trên cùng');

  const nen = $('#in-nen');
  nen.disabled = S.mong !== 'bang';
  $('#t-nen').classList.toggle('off', nen.disabled);
  $('#g-ham').hidden = S.ham === 'none';

  setErr('dim', r.issues.dim, '[data-key="f:0"]');
  setErr('mez', r.issues.mez, '[data-key=mezA]');
  setErr('ham', r.issues.ham, '[data-key=hamA]');
  setErr('tum', r.issues.tum, '[data-key=tumA]');

  const priceText = group(String(r.price));
  $('#r-short').textContent = short(r.cost);
  $('#r-exact').textContent = vnd(r.cost);
  $('#r-area').textContent = fmt(r.total) + ' m²';
  $('#r-price').textContent = priceText + ' đ/m²';
  $('#r-allin').textContent = shortRange(r.low, r.high);
  $('#dock-total').textContent = short(r.cost);
  $('#r-shape').textContent = MO_HINH[S.type].label + ' · ' + floorsText(r.n).toLowerCase();
  $('#svg').innerHTML = drawHouse(S, r);

  $('#tbody').innerHTML = r.rows.map(x =>
    `<tr><td><b>${x.name}</b>${x.note ? `<small>${x.note}</small>` : ''}</td><td>${fmt(x.area)} m² <small>× ${x.kText || pct(x.k)}</small></td><td class="q">${fmt(x.q)} m²</td></tr>`).join('');
  $('#tfoot').innerHTML =
    `<tr><td>Tổng diện tích quy đổi</td><td></td><td>${fmt(r.total)} m²</td></tr>` +
    `<tr><td>Đơn giá ${MO_HINH[S.type].label.toLowerCase()}</td><td></td><td>× ${priceText} đ/m²</td></tr>` +
    `<tr class="money"><td>Phần thô + nhân công hoàn thiện</td><td></td><td>${vnd(r.cost)}</td></tr>`;
  save();
  return r;
}

function summaryText() {
  const r = compute(S);
  const parts = [floorsText(r.n).toLowerCase()];
  if (S.mez) parts.push('lửng');
  if (S.tum) parts.push('tum');
  if (S.st) parts.push('sân thượng');
  const lines = [
    'DỰ TOÁN SƠ BỘ · MORI HOMES',
    'Mô hình: ' + MO_HINH[S.type].label,
    'Diện tích khu đất: ' + fmt(S.w) + ' × ' + fmt(S.l) + ' m = ' + fmt(r.Axd) + ' m²',
    'Kết cấu: ' + parts.join(', '),
    'Móng: ' + MONG[S.mong].short.toLowerCase() + (S.mong === 'bang' && S.nen ? ', có đổ nền bê tông' : '') + (HAM[S.ham] ? ' · Hầm ' + HAM[S.ham].label.toLowerCase() + ', ' + fmt(r.hamA) + ' m²' : ''),
    r.roofA > 0 ? 'Mái: ' + MAI[S.roof].label.toLowerCase() + ', ' + fmt(r.roofA) + ' m²' : 'Mái: sàn sân thượng',
    '',
    ...r.rows.map(x => '· ' + x.name + ': ' + fmt(x.area) + ' m² × ' + (x.kText || pct(x.k)) + ' = ' + fmt(x.q) + ' m²'),
    '',
    'Tổng diện tích quy đổi: ' + fmt(r.total) + ' m²',
    'Đơn giá ' + MO_HINH[S.type].label.toLowerCase() + ': ' + group(String(r.price)) + ' đ/m²',
    'Phần thô + nhân công hoàn thiện: ' + vnd(r.cost),
    'Cộng vật tư hoàn thiện (40–70%): khoảng ' + shortRange(r.low, r.high),
    '',
    'Nhờ MORI HOMES khảo sát và báo giá chính xác.',
    'MORI HOMES · Hotline ' + CONFIG.hotline + ' · ' + CONFIG.facebook
  ];
  return lines.join('\n');
}

/* ===== Sự kiện ===== */
const form = $('#form');
form.addEventListener('submit', e => e.preventDefault());
form.addEventListener('input', e => {
  const box = e.target.closest('.numin');
  if (!box) return;
  const v = parseNum(e.target.value);
  if (isNaN(v)) return;
  dropUndo();
  setVal(box.dataset.key, Math.min(+box.dataset.max, Math.max(+box.dataset.min, v)));
  update();
});
form.addEventListener('focusout', e => { if (e.target.closest('.numin')) setTimeout(syncInputs, 0); });
form.addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { dropUndo(); S.floors.splice(+rm.dataset.rm, 1); renderFloors(); update(); return; }
  if (e.target.closest('#add-floor') && S.floors.length < CONFIG.maxTang) {
    dropUndo();
    const last = S.floors[S.floors.length - 1];
    S.floors.push(S.floors.length > 1 ? last : null);
    renderFloors(); update();
  }
});
form.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'checkbox' && t.dataset.key) { dropUndo(); S[t.dataset.key] = t.checked; update(); }
  else if (t.type === 'radio') { dropUndo(); S[t.name] = t.value; update(); }
});
let undoState = null, msgTimer = 0;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function showResetMsg(text, withUndo) {
  clearTimeout(msgTimer);
  $('#reset-txt').textContent = text;
  $('#undo').hidden = !withUndo;
  $('#reset-msg').hidden = false;
  if (!withUndo) msgTimer = setTimeout(() => { $('#reset-msg').hidden = true; }, 3000);
}
// Khách nhập số mới sau khi đặt lại thì bỏ bản lưu cũ, để Hoàn tác không ghi đè số mới.
function dropUndo() { if (undoState) { undoState = null; $('#reset-msg').hidden = true; } }
$('#reset').addEventListener('click', () => {
  // Bấm đặt lại nhiều lần vẫn giữ số khách đã nhập, không lưu đè bằng số mặc định.
  if (!same(S, DEFAULTS)) undoState = clone(S);
  S = clone(DEFAULTS);
  renderFloors(); syncControls(); update();
  if (undoState) showResetMsg('Đã đặt lại thông số.', true);
  else showResetMsg('Thông số đang ở mặc định.', false);
});
$('#undo').addEventListener('click', () => {
  if (!undoState) return;
  S = undoState; undoState = null;
  renderFloors(); syncControls(); update();
  showResetMsg('Đã khôi phục thông số đã nhập.', false);
});

// Chép vào bộ nhớ tạm: thử cách chép trực tiếp trước (chạy được trong khung nhúng), rồi tới Clipboard API.
function legacyCopy(text) {
  const span = document.createElement('span');
  span.textContent = text;
  span.style.cssText = 'position:fixed;top:0;left:0;clip:rect(0,0,0,0);white-space:pre;user-select:text;-webkit-user-select:text';
  document.body.appendChild(span);
  const sel = getSelection(), range = document.createRange();
  range.selectNodeContents(span); sel.removeAllRanges(); sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges(); span.remove();
  return ok;
}
function copyText(text, onOk, onFail) {
  if (legacyCopy(text)) { onOk(); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(onOk, onFail); return; }
  } catch (e) {}
  onFail();
}

let copyTimer = 0;
$('#copy').addEventListener('click', () => {
  const text = summaryText();
  const btn = $('#copy'), lbl = $('#copy-l');
  copyText(text, () => {
    $('#copybox').hidden = true;
    btn.classList.add('done');
    lbl.textContent = 'Đã sao chép.';
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { btn.classList.remove('done'); lbl.textContent = 'Sao chép dự toán'; }, 2500);
  }, () => {
    const box = $('#copybox'), ta = $('#copy-text');
    ta.value = text; box.hidden = false; ta.focus(); ta.select();
  });
});

$('#copy-hot').addEventListener('click', () => {
  const btn = $('#copy-hot');
  copyText(CONFIG.hotline, () => {
    btn.textContent = 'Đã chép';
    setTimeout(() => { btn.textContent = 'Sao chép'; }, 2000);
  }, () => {
    const r = document.createRange(); r.selectNodeContents($('#hotline'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  });
});

$('#dock-go').addEventListener('click', () => {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#ket-qua').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
});
// Thanh tổng tiền dưới đáy: chỉ hiện khi khung hẹp, đang xem công cụ và chưa thấy ô kết quả
const dock = $('#dock');
let totalSeen = false, toolSeen = true, wide = false;
const paintDock = () => { dock.classList.toggle('away', totalSeen || !toolSeen); dock.classList.toggle('wide', wide); };
if ('IntersectionObserver' in window) {
  new IntersectionObserver(es => { es.forEach(en => { totalSeen = en.isIntersecting; }); paintDock(); }, { threshold: 0.35 }).observe($('#total-card'));
  new IntersectionObserver(es => { es.forEach(en => { toolSeen = en.isIntersecting; }); paintDock(); }).observe($('.cq'));
}
if ('ResizeObserver' in window) new ResizeObserver(es => { wide = es[0].contentRect.width >= 960; paintDock(); }).observe($('.cq'));

(function init() {
  root.querySelectorAll('input[name=type]').forEach(r => { r.nextElementSibling.querySelector('.k').textContent = group(String(MO_HINH[r.value].price)) + ' đ/m²'; });
  $('#hotline').textContent = CONFIG.hotline;
  $('#foot-hot').textContent = CONFIG.hotline;
  $('#call').href = 'tel:' + CONFIG.hotline.replace(/\D/g, '');
  $('#fb').href = CONFIG.facebook;
  $('#fb-t').textContent = CONFIG.facebook.replace(/^https?:\/\/(www\.)?/, '');
  renderFloors(); syncControls(); update();
})();

})();
</script>
